<title>Will You Date Me</title>
<meta name="description" content="A very serious and important question. Please choose wisely.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #ffeaf2;
    --bg-2: #ffd9e8;
    --surface: #ffffff;
    --surface-2: #ffd9e8;
    --line: #f6c1da;
    --text: #4a1130;
    --text-dim: #8a4a65;
    --accent: #ff3e86;
    --accent-ink: #ffffff;
    --accent-2: #ffb6d0;
    --glow: 255,62,134;
    --radius: 20px;
    --radius-sm: 12px;
    font-size: 16px;
  }

  *{ box-sizing: border-box; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100%;
    padding-left: 20px;
    padding-right: 20px;
    background-image:
      radial-gradient(60% 50% at 18% 0%, rgba(255,62,134,0.14), transparent 60%),
      radial-gradient(70% 60% at 100% 100%, rgba(255,182,208,0.55), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }

  html, body { height: 100%; }

  h1,h2,h3{
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-weight: 700;
    line-height: 1.05;
    text-wrap: balance;
    margin: 0;
  }

  ::selection{ background: var(--accent); color: var(--accent-ink); }

  :focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 8px;
  }

  #app{
    max-width: 560px;
    margin: 0 auto;
    padding-block: 48px;
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }

  .eyebrow{
    font-family: "Manrope", sans-serif;
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
  }
  .eyebrow::before{
    content: "";
    width: 22px;
    height: 1px;
    background: currentColor;
    opacity: 0.7;
  }

  /* ---------- Screen: Ask ---------- */

  .screen-ask{
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 28px;
    animation: rise 0.6s cubic-bezier(.22,1,.36,1) both;
  }

  .screen-ask h1{
    font-size: clamp(2.1rem, 7vw, 3.4rem);
    letter-spacing: -0.01em;
  }
  .screen-ask h1 em{
    font-style: italic;
    font-weight: 600;
    color: var(--accent);
  }

  .subtext{
    color: var(--text-dim);
    font-size: 1.05rem;
    line-height: 1.55;
    max-width: 46ch;
  }

  .choice-row{
    position: relative;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    min-height: 240px;
    align-items: flex-start;
    padding-top: 4px;
  }

  .btn{
    font-family: "Manrope", sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    border: none;
    border-radius: 999px;
    padding: 16px 34px;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active{ transform: scale(0.97); }

  .btn-yes{
    background: var(--accent);
    color: var(--accent-ink);
    box-shadow: 0 10px 30px -8px rgba(var(--glow), 0.55);
  }
  .btn-yes:hover{ transform: translateY(-2px); box-shadow: 0 14px 34px -8px rgba(var(--glow), 0.7); }

  .btn-no{
    background: transparent;
    color: var(--text-dim);
    border: 1.5px solid var(--line);
    position: relative;
    z-index: 2;
  }
  .btn-no.dodging{
    position: absolute;
    transition: left 0.32s cubic-bezier(.22,1,.36,1), top 0.32s cubic-bezier(.22,1,.36,1);
  }

  .dodge-note{
    font-size: 0.85rem;
    color: var(--text-dim);
    opacity: 0.85;
    min-height: 1.2em;
  }

  .footnote{
    color: var(--text-dim);
    font-size: 0.82rem;
    opacity: 0.75;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    margin-top: 12px;
  }

  /* ---------- Screen: Pick a time ---------- */

  .screen-plan{
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 30px;
    padding-bottom: 110px;
    animation: rise 0.5s cubic-bezier(.22,1,.36,1) both;
  }

  .plan-head h1{ font-size: clamp(1.9rem, 6vw, 2.6rem); }

  .back-link{
    align-self: flex-start;
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: "Manrope", sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 0;
  }
  .back-link:hover{ color: var(--text); }

  section.field{ display: flex; flex-direction: column; gap: 12px; }
  .field-label{
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--text);
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .field-label .field-sub{ font-weight: 500; font-size: 0.8rem; color: var(--text-dim); }

  .picker-input{
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 15px 16px;
    font-family: "Manrope", sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--text);
    color-scheme: light;
    width: 100%;
    transition: border-color 0.15s ease;
  }
  .picker-input:hover{ border-color: var(--accent); }
  .picker-input:focus{ border-color: var(--accent); }

  .activity-grid{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .activity-chip{
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 16px 8px;
    text-align: center;
    cursor: pointer;
    color: var(--text);
    font-family: "Manrope", sans-serif;
    font-weight: 600;
    font-size: 0.82rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }
  .activity-chip .emoji{ font-size: 1.5rem; }
  .activity-chip:hover{ border-color: var(--accent); transform: translateY(-1px); }
  .activity-chip.selected{ background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .custom-input{
    background: transparent;
    border: none;
    border-bottom: 1.5px dashed var(--line);
    text-align: center;
    font-family: "Manrope", sans-serif;
    font-style: italic;
    font-size: 0.92rem;
    color: var(--text);
    padding: 10px 4px;
    width: 100%;
  }
  .custom-input::placeholder{ color: var(--text-dim); opacity: 0.85; }
  .custom-input:focus{ border-color: var(--accent); }

  .bottom-bar{
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, transparent, var(--bg) 30%);
    padding: 24px 20px calc(18px + env(safe-area-inset-bottom, 0px));
    display: flex;
    justify-content: center;
  }
  .bottom-bar-inner{
    width: 100%;
    max-width: 520px;
    display: flex;
    gap: 12px;
  }
  .btn-continue{
    flex: 1;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: "Manrope", sans-serif;
    font-weight: 800;
    font-size: 1rem;
    border: none;
    border-radius: 999px;
    padding: 16px;
    cursor: pointer;
    box-shadow: 0 10px 30px -8px rgba(var(--glow), 0.5);
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .btn-continue:hover{ transform: translateY(-2px); }
  .btn-continue:disabled{
    opacity: 0.35;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  /* ---------- Screen: Confirmation ---------- */

  .screen-confirm{
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 26px;
    animation: rise 0.55s cubic-bezier(.22,1,.36,1) both;
    position: relative;
  }
  .confirm-card{
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 26px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .confirm-row{
    display: flex;
    align-items: center;
    gap: 14px;
    padding-block: 4px;
  }
  .confirm-row .ic{ font-size: 1.3rem; width: 28px; text-align: center; }
  .confirm-row .lbl{ color: var(--text-dim); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; display:block; }
  .confirm-row .val{ font-weight: 700; font-size: 1.05rem; }
  .confirm-actions{ display: flex; gap: 12px; flex-wrap: wrap; }
  .btn-copy{
    background: var(--accent);
    color: var(--accent-ink);
    font-family: "Manrope", sans-serif;
    font-weight: 800;
    border: none;
    border-radius: 999px;
    padding: 14px 26px;
    cursor: pointer;
    flex: 1;
    min-width: 160px;
  }
  .btn-edit{
    background: none;
    border: 1.5px solid var(--line);
    color: var(--text);
    font-family: "Manrope", sans-serif;
    font-weight: 700;
    border-radius: 999px;
    padding: 14px 22px;
    cursor: pointer;
  }
  .toast{
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%) translateY(12px);
    background: var(--text);
    color: var(--bg);
    font-family: "Manrope", sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 10px 20px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 50;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  .confetti{
    position: absolute;
    inset: -20px 0 auto 0;
    height: 0;
    pointer-events: none;
    overflow: visible;
  }
  .confetti span{
    position: absolute;
    top: -20px;
    font-size: 1.3rem;
    animation: fall 2.6s ease-in forwards;
    will-change: transform, opacity;
  }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  @keyframes fall{
    0%{ transform: translateY(0) rotate(0deg); opacity: 1; }
    100%{ transform: translateY(90vh) rotate(280deg); opacity: 0; }
  }

  .burst-piece{
    position: absolute;
    transform: translate(-50%,-50%) scale(0.6);
    opacity: 1;
    animation: burst 0.8s cubic-bezier(.16,.8,.4,1) forwards;
  }
  @keyframes burst{
    0%{ transform: translate(-50%,-50%) scale(0.5); opacity: 1; }
    100%{ transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.15); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce){
    .screen-ask, .screen-plan, .screen-confirm{ animation: none; }
    .btn-no.dodging{ transition: none; }
    .confetti span{ animation: none; opacity: 0; }
    .burst-piece{ animation: none; opacity: 0; }
  }

  @media (max-width: 420px){
    .activity-grid{ grid-template-columns: repeat(2, 1fr); }
  }
</style>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var ACTIVITIES = [
    { id: "food",   emoji: "🍜", label: "Food" },
    { id: "drinks", emoji: "🍸", label: "Drinks" },
    { id: "coffee", emoji: "☕", label: "Coffee" },
    { id: "walk",   emoji: "🌳", label: "Park walk" },
    { id: "boxing", emoji: "🥊", label: "Boxing" },
    { id: "movie",  emoji: "🎬", label: "Watch a movie" }
  ];

  var NO_MESSAGES = [
    "nice try.",
    "still no.",
    "not gonna catch this one.",
    "okay now you're just trying.",
    "there is only one right answer, remember?"
  ];

  function formatDateLong(dateStr){
    if (!dateStr) return "";
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    var dow = new Intl.DateTimeFormat(undefined, { weekday: "long" }).format(d);
    var month = new Intl.DateTimeFormat(undefined, { month: "long" }).format(d);
    return dow + ", " + month + " " + d.getDate();
  }

  function formatTime12(hhmm){
    if (!hhmm) return "";
    var bits = hhmm.split(":");
    var h = parseInt(bits[0], 10);
    var m = bits[1];
    var period = h >= 12 ? "PM" : "AM";
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + ":" + m + " " + period;
  }

  function playCuteSound(){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ctx = new Ctx();
      var now = ctx.currentTime;
      var notes = [660, 880, 1046.5];
      notes.forEach(function(freq, i){
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        var start = now + i * 0.09;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.2, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.28);
        osc.connect(gain).connect(ctx.destination);
        osc.start(start);
        osc.stop(start + 0.32);
      });
      setTimeout(function(){ try{ ctx.close(); }catch(e){} }, 900);
    } catch(err){}
  }

  function burstEmojis(originEl){
    if (reduceMotion || !originEl) return;
    var rect = originEl.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var pieces = ["💕","✨","🎉","💗","⭐","😍"];
    var layer = document.createElement("div");
    layer.style.position = "fixed";
    layer.style.left = "0"; layer.style.top = "0"; layer.style.right = "0"; layer.style.bottom = "0";
    layer.style.pointerEvents = "none";
    layer.style.zIndex = "60";
    for (var i = 0; i < 16; i++){
      var span = document.createElement("span");
      span.textContent = pieces[i % pieces.length];
      span.className = "burst-piece";
      span.style.left = cx + "px";
      span.style.top = cy + "px";
      var angle = Math.random() * Math.PI * 2;
      var dist = 70 + Math.random() * 100;
      var dx = Math.cos(angle) * dist;
      var dy = Math.sin(angle) * dist - 50;
      span.style.setProperty("--dx", dx + "px");
      span.style.setProperty("--dy", dy + "px");
      span.style.fontSize = (1 + Math.random() * 0.7) + "rem";
      layer.appendChild(span);
    }
    document.body.appendChild(layer);
    setTimeout(function(){ layer.remove(); }, 900);
  }

  var state = { screen: "ask", day: "", time: "", activity: null, customActivity: "", noHits: 0 };

  // Responses are logged as GitHub Issues on this repo, using a token scoped
  // ONLY to "Issues: Read and write" on this one repo. See admin.html to view them.
  var GITHUB_REPO = "tcwork2001/date-with-Chien";
  var GITHUB_TOKEN = "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";

  function submitResponse(){
    if (!GITHUB_TOKEN) return;
    try{
      var act = getActivityDisplay();
      var day = formatDateLong(state.day);
      var time = formatTime12(state.time);
      var activity = act ? act.label : "";
      var title = "RSVP: " + (day || "?") + (time ? " at " + time : "");
      var body = [
        "**Day:** " + (day || "—"),
        "**Time:** " + (time || "—"),
        "**Activity:** " + (activity || "—"),
        "**Submitted at:** " + new Date().toISOString()
      ].join("\n");

      fetch("https://api.github.com/repos/" + GITHUB_REPO + "/issues", {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + GITHUB_TOKEN,
          "Accept": "application/vnd.github+json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ title: title, body: body, labels: ["rsvp"] })
      }).catch(function(){});
    } catch(err){}
  }

  function save(next){ state = Object.assign({}, state, next); render(); }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._h);
    showToast._h = setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }

  function renderAsk(){
    return (
      '<div class="screen-ask">' +
        '<div class="eyebrow">A very important question</div>' +
        '<h1>Will you go on a <em>date</em> with me?</h1>' +
        '<p class="subtext">Take your time. Choose carefully. There is definitely a right answer.</p>' +
        '<div class="choice-row" id="choiceRow">' +
          '<button class="btn btn-yes" id="yesBtn" type="button">Yes 💕</button>' +
          '<button class="btn btn-no" id="noBtn" type="button" aria-label="No (good luck clicking this)">No 😢</button>' +
        '</div>' +
        '<p class="dodge-note" id="dodgeNote" aria-live="polite"></p>' +
        '<p class="footnote">yes I made this website · yes I used AI · no I won’t marry you immediately, let’s go on a date first</p>' +
      '</div>'
    );
  }

  function renderPlan(){
    var actHtml = ACTIVITIES.map(function(a){
      var sel = state.activity === a.id ? " selected" : "";
      return '<button class="activity-chip' + sel + '" type="button" data-activity="' + a.id + '">' +
        '<span class="emoji">' + a.emoji + '</span><span>' + a.label + '</span>' +
      '</button>';
    }).join("");

    var canContinue = state.day && state.time && (state.activity || (state.customActivity && state.customActivity.trim()));

    return (
      '<div class="screen-plan">' +
        '<button class="back-link" id="backBtn" type="button">← back</button>' +
        '<div class="plan-head">' +
          '<div class="eyebrow">Step 2 of 2</div>' +
          '<h1>Pick a time.</h1>' +
          '<p class="subtext">You said yes (legally binding). Now the fun part — when are we doing this?</p>' +
        '</div>' +
        '<section class="field">' +
          '<span class="field-label">Which day</span>' +
          '<input type="date" id="dayInput" class="picker-input" value="' + escapeHtml(state.day || "") + '">' +
        '</section>' +
        '<section class="field">' +
          '<span class="field-label">What time</span>' +
          '<input type="time" id="timeInput" class="picker-input" value="' + escapeHtml(state.time || "") + '">' +
        '</section>' +
        '<section class="field">' +
          '<span class="field-label">What are we doing</span>' +
          '<div class="activity-grid">' + actHtml + '</div>' +
          '<input type="text" id="customActivity" class="custom-input" placeholder="or type your own idea…" value="' + escapeHtml(state.customActivity || "") + '">' +
        '</section>' +
        '<div class="bottom-bar"><div class="bottom-bar-inner">' +
          '<button class="btn-continue" id="continueBtn" type="button"' + (canContinue ? '' : ' disabled') + '>Pick a time to continue</button>' +
        '</div></div>' +
      '</div>'
    );
  }

  function findActivity(id){ for (var i=0;i<ACTIVITIES.length;i++){ if (ACTIVITIES[i].id===id) return ACTIVITIES[i]; } return null; }

  function getActivityDisplay(){
    if (state.activity){
      var a = findActivity(state.activity);
      if (a) return { emoji: a.emoji, label: a.label };
    }
    if (state.customActivity && state.customActivity.trim()){
      return { emoji: "📍", label: state.customActivity.trim() };
    }
    return null;
  }

  function updateContinueState(){
    var btn = document.getElementById("continueBtn");
    if (!btn) return;
    var can = state.day && state.time && (state.activity || (state.customActivity && state.customActivity.trim()));
    btn.disabled = !can;
  }

  function renderConfirm(){
    var dayText = formatDateLong(state.day);
    var timeText = formatTime12(state.time);
    var act = getActivityDisplay();

    var confettiHtml = "";
    if (!reduceMotion){
      var pieces = ["💕","✨","🎉","💌","🥂"];
      var spans = [];
      for (var i=0;i<16;i++){
        var left = Math.round(Math.random()*100);
        var delay = (Math.random()*0.6).toFixed(2);
        var dur = (2 + Math.random()*1.2).toFixed(2);
        var piece = pieces[i % pieces.length];
        spans.push('<span style="left:' + left + '%;animation-delay:' + delay + 's;animation-duration:' + dur + 's">' + piece + '</span>');
      }
      confettiHtml = '<div class="confetti">' + spans.join("") + '</div>';
    }

    return (
      '<div class="screen-confirm">' +
        confettiHtml +
        '<div class="eyebrow">It’s official</div>' +
        '<h1>It’s a date.</h1>' +
        '<div class="confirm-card">' +
          '<div class="confirm-row"><span class="ic">📅</span><span><span class="lbl">Day</span><span class="val">' + (dayText || "—") + '</span></span></div>' +
          '<div class="confirm-row"><span class="ic">🕚️</span><span><span class="lbl">Time</span><span class="val">' + (timeText || "—") + '</span></span></div>' +
          '<div class="confirm-row"><span class="ic">' + (act ? act.emoji : "✨") + '</span><span><span class="lbl">Plan</span><span class="val">' + (act ? escapeHtml(act.label) : "surprise me") + '</span></span></div>' +
        '</div>' +
        '<div class="confirm-actions">' +
          '<button class="btn-copy" id="copyBtn" type="button">Copy my answer</button>' +
          '<button class="btn-edit" id="editBtn" type="button">Change my answer</button>' +
        '</div>' +
      '</div>'
    );
  }

  function render(){
    var app = document.getElementById("app");
    if (state.screen === "ask") app.innerHTML = renderAsk();
    else if (state.screen === "plan") app.innerHTML = renderPlan();
    else app.innerHTML = renderConfirm();
    attach();
  }

  function moveNoButton(){
    var row = document.getElementById("choiceRow");
    var btn = document.getElementById("noBtn");
    if (!row || !btn || reduceMotion) return;
    btn.classList.add("dodging");
    var rowRect = row.getBoundingClientRect();
    var bw = btn.offsetWidth || 90;
    var bh = btn.offsetHeight || 52;
    var maxLeft = Math.max(rowRect.width - bw, 0);
    var maxTop = Math.max(rowRect.height - bh, 0);
    var left = Math.random() * maxLeft;
    var top = Math.random() * maxTop;
    btn.style.left = left + "px";
    btn.style.top = top + "px";
    state.noHits++;
    var note = document.getElementById("dodgeNote");
    if (note){
      note.textContent = NO_MESSAGES[Math.min(state.noHits - 1, NO_MESSAGES.length - 1)];
    }
  }

  function attach(){
    if (state.screen === "ask"){
      var yesBtn = document.getElementById("yesBtn");
      var noBtn = document.getElementById("noBtn");
      var choiceRow = document.getElementById("choiceRow");
      if (yesBtn) yesBtn.addEventListener("click", function(){ save({ screen: "plan" }); });
      if (noBtn){
        if (!reduceMotion){
          noBtn.addEventListener("mouseenter", moveNoButton);
          noBtn.addEventListener("click", function(e){ e.preventDefault(); moveNoButton(); });
          noBtn.addEventListener("touchstart", function(e){ e.preventDefault(); moveNoButton(); }, { passive: false });
        } else {
          noBtn.addEventListener("click", function(){
            state.noHits++;
            var note = document.getElementById("dodgeNote");
            if (note) note.textContent = NO_MESSAGES[Math.min(state.noHits - 1, NO_MESSAGES.length - 1)];
          });
        }
      }
    } else if (state.screen === "plan"){
      var backBtn = document.getElementById("backBtn");
      if (backBtn) backBtn.addEventListener("click", function(){ save({ screen: "ask" }); });

      var dayInput = document.getElementById("dayInput");
      if (dayInput) dayInput.addEventListener("change", function(){ save({ day: dayInput.value }); });

      var timeInput = document.getElementById("timeInput");
      if (timeInput) timeInput.addEventListener("change", function(){ save({ time: timeInput.value }); });

      Array.prototype.forEach.call(document.querySelectorAll("[data-activity]"), function(el){
        el.addEventListener("click", function(){
          save({ activity: el.getAttribute("data-activity"), customActivity: "" });
        });
      });

      var customActivity = document.getElementById("customActivity");
      if (customActivity) customActivity.addEventListener("input", function(){
        state.customActivity = customActivity.value;
        if (customActivity.value.trim()){
          state.activity = null;
          Array.prototype.forEach.call(document.querySelectorAll(".activity-chip.selected"), function(el){
            el.classList.remove("selected");
          });
        }
        updateContinueState();
      });

      var continueBtn = document.getElementById("continueBtn");
      if (continueBtn) continueBtn.addEventListener("click", function(){
        if (!(state.day && state.time && (state.activity || (state.customActivity && state.customActivity.trim())))) return;
        playCuteSound();
        burstEmojis(continueBtn);
        submitResponse();
        setTimeout(function(){ save({ screen: "confirm" }); }, reduceMotion ? 0 : 550);
      });
    } else {
      var editBtn = document.getElementById("editBtn");
      if (editBtn) editBtn.addEventListener("click", function(){ save({ screen: "plan" }); });

      var copyBtn = document.getElementById("copyBtn");
      if (copyBtn) copyBtn.addEventListener("click", function(){
        var dayText = formatDateLong(state.day), timeText = formatTime12(state.time), act = getActivityDisplay();
        var text = "I'm in — " + (dayText || "") +
          " at " + (timeText || "") + ", let's do " + (act ? act.label.toLowerCase() : "something you plan") + ". 💕";
        var done = function(){ showToast("Copied — go paste it to them"); };
        var fail = function(){ showToast("Couldn't copy — select and copy manually"); };
        try{
          if (navigator.clipboard && navigator.clipboard.writeText){
            navigator.clipboard.writeText(text).then(done, fail);
          } else {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            done();
          }
        } catch(err){ fail(); }
      });
    }
  }

  function start(initial){
    state = Object.assign(state, initial || {});
    render();
  }

  try{
    if (window.claude && window.claude.hot){
      window.claude.hot.snapshot(function(){ return state; });
      if (window.claude.hot.ready) window.claude.hot.ready(start);
      else start(window.claude.hot.data || {});
    } else {
      start({});
    }
  } catch(err){
    start({});
  }
})();
</script>
